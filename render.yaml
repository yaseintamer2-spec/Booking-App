services:
  - type: web
    name: kickoff-api
    runtime: node
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @workspace/api-server run build
    startCommand: corepack pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

  - type: web
    name: kickoff-web
    runtime: static
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @workspace/mobile run build
    staticPublishPath: artifacts/mobile/dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        fromService:
          type: web
          name: kickoff-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
